name: herramientas

on:
  pull_request:
    paths:
      - "herramientas/**"
      - ".github/workflows/herramientas.yml"
      - ".github/workflows/guardas.yml"
  push:
    branches: [main]
    paths:
      - "herramientas/**"
      - ".github/workflows/herramientas.yml"
      - ".github/workflows/guardas.yml"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herramientas
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
