[project]
name = "guardas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jair Rangel", email = "jairrangel19783@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
guarda-alcance = "guardas.alcance_pr:main"
guarda-independencia = "guardas.independencia:main"
guarda-binarios = "guardas.binarios:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]
